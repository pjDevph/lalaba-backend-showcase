sonar.projectKey=lalaba-be-dev
sonar.projectName=LALABA · Backend (NestJS / GraphQL)
sonar.projectVersion=0.0.1
# sonar.organization=YOUR_ORG_KEY  ← uncomment and set this only when using SonarCloud

sonar.sources=src
sonar.language=ts
sonar.sourceEncoding=UTF-8

# TypeScript config
sonar.typescript.tsconfigPath=tsconfig.json

# Coverage — generated by: npm run test:cov
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclude from analysis entirely
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/test/**,\
  **/*.spec.ts,\
  **/*.d.ts,\
  src/main.ts

# Exclude from coverage metrics only (code quality still analyzed)
# Module files and DTOs have no testable logic — only decorators/providers
sonar.coverage.exclusions=\
  **/*.module.ts,\
  src/main.ts,\
  **/*.dto.ts

sonar.scm.disabled=true
sonar.qualitygate.wait=false
